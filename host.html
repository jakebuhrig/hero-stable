<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hero Stable windows</title>
  </head>
  <body class="host">
    <!-- Shown until the app mounts. If it never goes away, or turns into an error, that is the diagnosis. -->
    <div
      id="boot"
      style="position:fixed;top:12px;left:12px;z-index:99999;padding:6px 10px;border-radius:6px;font:13px system-ui,sans-serif;color:#fff;background:#2c3047;border:1px solid #555;max-width:80vw"
    >
      Hero Stable: loading…
    </div>
    <div id="root"></div>
    <script>
      (function () {
        function show(msg) {
          var b = document.getElementById("boot");
          if (b) {
            b.textContent = "Hero Stable error: " + msg;
            b.style.background = "#7a1f1f";
          }
        }
        window.addEventListener("error", function (e) {
          show((e.message || "script error") + (e.filename ? " (" + e.filename.split("/").pop() + ")" : ""));
        });
        window.addEventListener("unhandledrejection", function (e) {
          show(String((e.reason && e.reason.message) || e.reason));
        });
      })();
    </script>
    <script type="module" src="/src/host-main.tsx"></script>
  </body>
</html>
